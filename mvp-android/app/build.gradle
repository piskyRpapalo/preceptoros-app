plugins { id 'com.android.application' }

// The panels are the app's own interface/ folder, copied at build time: nothing is duplicated in git.
def secretDir = new File(System.getProperty("user.home"), ".config/preceptoros/android")
def passFile = new File(secretDir, "pass")
def useReleaseSigning = project.findProperty('unsignedRelease')?.toString() != 'true' && passFile.exists()
// v7 is installed on owner devices. Never produce an accidental downgrade by default.
def mvpVersionCode = (project.hasProperty('mvpVersionCode') ? project.property('mvpVersionCode') : '8') as Integer
// All normal Android builds target the ONE canonical signed APP identity.
// The legacy org.preceptoros.mvp ID is allowed only for an explicit, owner-led
// migration/export build. Changing the package ID is NOT an in-place update,
// even when both APKs share the same signing certificate.
def mvpAppId = project.hasProperty('mvpAppId') ? project.property('mvpAppId') : 'org.preceptoros.app'
def legacyMigrationOnly = project.findProperty('legacyMigrationOnly')?.toString() == 'true'
if (!(mvpAppId in ['org.preceptoros.mvp', 'org.preceptoros.app'])) {
    throw new GradleException('Unexpected Android package id')
}
if (mvpAppId == 'org.preceptoros.mvp' && !legacyMigrationOnly) {
    throw new GradleException('Legacy Android package needs explicit -PlegacyMigrationOnly=true for data export; never a second normal APP')
}
if (legacyMigrationOnly && mvpAppId != 'org.preceptoros.mvp') {
    throw new GradleException('Legacy migration flag may only be used with the legacy package ID')
}
if (mvpVersionCode < 1) {
    throw new GradleException('Android versionCode must be positive')
}
if (mvpAppId == 'org.preceptoros.app' && mvpVersionCode < 8) {
    throw new GradleException('Canonical Android upgrade requires versionCode >= 8 after owner release v7')
}

// Profile: PUBLIC (default, BYO) or OWNER (explicit -PappProfile=OWNER).
// PUBLIC/BYO cannot include mandatory rack endpoints; OWNER still requires verified Serve identity.
def appProfile = project.findProperty('appProfile')?.toString()
if (appProfile && !(appProfile in ['PUBLIC', 'OWNER'])) {
    throw new GradleException("Invalid appProfile: ${appProfile}. Must be PUBLIC or OWNER.")
}
def isOwnerProfile = appProfile == 'OWNER'

// The APP repository root is one level above mvp-android/.
def appRoot = rootProject.file('..').absoluteFile

// Read the versioned asset allowlist.
// PUBLIC profile uses a restricted allowlist that excludes files with private API routes.
// OWNER profile uses the full allowlist.
def allowlistName = isOwnerProfile ? 'asset_allowlist_v1.txt' : 'asset_allowlist_public.txt'
def allowlistFile = new File(appRoot, 'mvp-android/' + allowlistName)
if (!allowlistFile.exists()) {
    throw new GradleException("Asset allowlist not found: mvp-android/${allowlistName}")
}
def allowlistPaths = allowlistFile.readLines()
    .findAll { line -> line.trim() && !line.trim().startsWith('#') }
    .collect { it.trim() }

// PUBLIC profile: forbidden private API route patterns (byte-level check).
// If any staged asset contains these strings, the build MUST fail.
def PUBLIC_FORBIDDEN_ROUTES = [
    '/api/hexelion/chat',
    '/api/hexelion/decision',
    '/api/hexelion/search',
    '/api/hitl',
    '/api/nodo/identity',
    '/api/nodo/edificio',
    '/api/nodo/estado',
    '/api/nodo/export',
]

// PUBLIC profile: forbidden credential and private-infrastructure markers.
// These are regex patterns applied to staged asset bytes.
// A match FAILS the build — no real secrets are stored, only shape detection.
// Patterns are tuned to avoid false positives on security-defense code that
// references these shapes for detection purposes.
def PUBLIC_FORBIDDEN_PATTERNS = [
    // GitHub PAT value: ghp_/gho_/ghu_/ghs_/ghr_ followed by 20+ alphanum chars
    // (not inside a regex literal — regex literals contain / or \ before the prefix)
    ~/gh[pousr]_[A-Za-z0-9]{20,}/,
    // PEM private key header (actual key material, not a mention in prose)
    ~/-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----/,
    // Private rack hostname (case-insensitive)
    ~/(?i)onexstation/,
    // Tailscale MagicDNS private hostnames (.ts.net suffix)
    ~/[A-Za-z0-9._-]+\.ts\.net/,
    // RFC1918 private IPv4 addresses (10.x, 172.16-31.x, 192.168.x)
    // Must match a full 4-octet IP (not partial numbers like "10.5px") optionally followed by :port
    ~/(?:^|[^0-9.])(?:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})(?::[0-9]+)?(?:[^0-9.]|$)/,
    // CGNAT 100.64/10 addresses (100.64.0.0 - 100.127.255.255)
    // Must match a full 4-octet IP optionally followed by :port
    ~/(?:^|[^0-9.])100\.(?:[6-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}(?::[0-9]+)?(?:[^0-9.]|$)/,
]

// Security validation at configuration time: reject traversal, duplicates, symlinks.
def seenAllowlist = new HashSet<String>()
def rootPath = appRoot.toPath().normalize()
for (String rel in allowlistPaths) {
    if (rel.contains('..') || rel.startsWith('/')) {
        throw new GradleException("Allowlist contains path traversal: ${rel}")
    }
    def fullPath = rootPath.resolve(rel).normalize()
    if (!fullPath.startsWith(rootPath)) {
        throw new GradleException("Allowlist path escapes project root: ${rel}")
    }
    if (!seenAllowlist.add(rel)) {
        throw new GradleException("Duplicate entry in allowlist: ${rel}")
    }
    def fileObj = new File(fullPath.toString())
    if (fileObj.exists() && java.nio.file.Files.isSymbolicLink(fileObj.toPath())) {
        throw new GradleException("Allowlist entry is a symlink (rejected): ${rel}")
    }
    if (!fileObj.exists() && !rel.contains('offline-mini.gguf')) {
        throw new GradleException("Allowlist entry missing: ${rel}")
    }
}

// Group allowlist paths by source prefix.
def interfacePaths = allowlistPaths.findAll { it.startsWith('interface/') }
def assetsPaths = allowlistPaths.findAll { it.startsWith('assets/') }
def mvpPaths = allowlistPaths.findAll { it.startsWith('mvp-android/') && !it.startsWith('mvp-android/legal/') }
def legalPaths = allowlistPaths.findAll { it.startsWith('mvp-android/legal/') }

// Build include/exclude sets for interface/ copy.
def allowedInterfaceBases = interfacePaths.collect { it.substring('interface/'.length()) }
def allowedAssetsBases = assetsPaths.collect { it.substring('assets/'.length()) }

def assetsDir = file('src/main/assets')

// Safety gate: validate generated output before any copy touches it.
tasks.register('prepareAssets') {
    doLast {
        def assetsPath = assetsDir.toPath().normalize()
        // 1. Reject symlink at the assets directory itself.
        if (java.nio.file.Files.isSymbolicLink(assetsPath)) {
            throw new GradleException('Refusing to stage assets: src/main/assets is a symlink')
        }
        // 2. Reject if resolved path escapes the expected module location (projectDir/src/main/assets).
        def expectedPrefix = projectDir.toPath().resolve('src/main/assets').normalize()
        if (!assetsPath.startsWith(expectedPrefix.toString())) {
            throw new GradleException('Refusing to stage assets: resolved path escapes expected location')
        }
        // 3. Remove only the GENERATED contents (files and subdirectories we created).
        if (assetsDir.exists()) {
            // Collect files and dirs first to avoid concurrent modification.
            def filesToDelete = []
            def dirsToDelete = []
            assetsDir.eachFileRecurse { f ->
                if (f.isFile()) filesToDelete << f
            }
            assetsDir.eachDirRecurse { d ->
                if (d != assetsDir) dirsToDelete << d
            }
            // Delete files first.
            filesToDelete.each { it.delete() }
            // Delete directories bottom-up (deepest first).
            dirsToDelete.sort { a, b -> b.toString().compareTo(a.toString()) }.each { it.delete() }
        }
    }
}

tasks.register('copyPanelsInterface', Copy) {
    dependsOn 'prepareAssets'
    from(new File(appRoot, 'interface')) {
        exclude 'legacy/**'
        allowedInterfaceBases.each { include it }
        exclude { details ->
            def relPath = details.relativePath.toString()
            if (allowedInterfaceBases.contains(relPath)) return false
            for (String a in allowedInterfaceBases) {
                if (a.startsWith(relPath + '/')) return false
            }
            return true
        }
    }
    into assetsDir
}

tasks.register('copyPanelsAssets', Copy) {
    dependsOn 'prepareAssets'
    from(new File(appRoot, 'assets')) {
        allowedAssetsBases.each { include it }
        exclude { details ->
            def relPath = details.relativePath.toString()
            if (allowedAssetsBases.contains(relPath)) return false
            for (String a in allowedAssetsBases) {
                if (a.startsWith(relPath + '/')) return false
            }
            return true
        }
    }
    // WebViewAssetLoader.AssetsPathHandler maps /assets/X → src/main/assets/assets/X
    // so the 4 PWA icons and compass.svg must live under the assets/ subdirectory.
    into file('src/main/assets/assets')
}

tasks.register('copyPanelsBridges', Copy) {
    dependsOn 'prepareAssets'
    // Android-only capability: bridge scripts evaluated by MainActivity.
    from(rootProject.file('android_review_bridge.js'))
    from(rootProject.file('android_openworld_bridge.js'))
    from(rootProject.file('offline_mini.js'))
    from(rootProject.file('android_join_bridge.js'))
    from(rootProject.file('android_heartbeat_bridge.js'))
    from(rootProject.file('android_node_bridge.js'))
    into assetsDir
}

// Legal copy: only the three allowlisted license files, never the whole folder.
def legalAllowlist = legalPaths.collect { it.substring('mvp-android/legal/'.length()) }
tasks.register('copyPanelsLicenses', Copy) {
    dependsOn 'prepareAssets'
    from(new File(appRoot, 'mvp-android/legal')) {
        legalAllowlist.each { include it }
        exclude { details ->
            def relPath = details.relativePath.toString()
            !legalAllowlist.contains(relPath)
        }
    }
    into file('src/main/assets/licenses')
}

// PUBLIC profile: generate the source-derived public projection HTML.
// This replaces interface/app.html with a sanitized six-panel shell that
// contains no private API route strings. The projection is derived from
// the canonical interface/app.html at build time via bin/package_public_mini.py.
// It runs AFTER copyPanels sub-tasks so the generated app.html survives.
def generatePublicProjection = tasks.register('generatePublicProjection') {
    onlyIf { !isOwnerProfile }
    dependsOn 'copyPanelsInterface', 'copyPanelsAssets', 'copyPanelsBridges', 'copyPanelsLicenses'
    doLast {
        def python = System.getenv('PYTHON3') ?: 'python3'
        def script = new File(appRoot, 'bin/package_public_mini.py')
        if (!script.exists()) {
            throw new GradleException('PUBLIC projection unavailable: bin/package_public_mini.py not found. NO_DATA(public_sanitized_projection_unavailable)')
        }
        def tmpDir = new File(buildDir, 'public-projection-tmp')
        tmpDir.mkdirs()
        def proc = [python, '-u', script.toString(), '--out', tmpDir.toString()].execute()
        def stdout = new StringWriter()
        def stderr = new StringWriter()
        proc.waitForProcessOutput(stdout, stderr)
        if (proc.exitValue() != 0) {
            throw new GradleException("PUBLIC projection generation failed: ${stderr.toString()}")
        }
        // The script writes dist/public-mini-app/app/index.html (the sanitized HTML).
        // Copy it as app.html into assets/ so MainActivity loads it.
        def projHtml = new File(tmpDir, 'app/index.html')
        if (!projHtml.exists()) {
            throw new GradleException('PUBLIC projection did not produce index.html. NO_DATA(public_sanitized_projection_unavailable)')
        }
        def destHtml = new File(assetsDir, 'app.html')
        destHtml.parentFile.mkdirs()
        destHtml.text = projHtml.text
        // Also copy public-boot.js, public-mini.css, and the public sw.js if present.
        for (def extra in ['public-boot.js', 'public-mini.css', 'sw.js']) {
            def src = new File(tmpDir, "app/${extra}")
            if (src.exists()) {
                def dst = new File(assetsDir, extra)
                dst.text = src.text
            }
        }
        // Copy the face/bubble subdirectory if present.
        def faceSrc = new File(tmpDir, 'app/face/bubble')
        if (faceSrc.exists()) {
            def faceDst = new File(assetsDir, 'face/bubble')
            faceDst.mkdirs()
            faceSrc.eachFile { f ->
                if (f.isFile()) {
                    new File(faceDst, f.name).text = f.text
                }
            }
        }
        // Copy assets from projection if present.
        def assetsSrc = new File(tmpDir, 'app/assets')
        if (assetsSrc.exists()) {
            assetsSrc.eachFile { f ->
                if (f.isFile()) {
                    new File(assetsDir, 'assets/' + f.name).parentFile.mkdirs()
                    new File(assetsDir, 'assets/' + f.name).bytes = f.bytes
                }
            }
        }
    }
}

// PUBLIC profile: byte-level verification that no staged asset contains forbidden content.
// Scans ALL staged files (including binaries like PNG, SVG, JSON, GGUF) using
// a forward-only streaming FileInputStream with bounded tail overlap for cross-boundary matches.
// This runs AFTER copyPanels and FAILS the build if any violation is found.
// Matched byte values are NEVER printed to build logs — only the cause class.
def verifyPublicAssets = tasks.register('verifyPublicAssets') {
    onlyIf { !isOwnerProfile }
    doLast {
        if (!assetsDir.exists()) {
            return
        }
        def violations = []
        // Buffer size for streaming scan (64 KiB per read)
        final int BUF_SIZE = 65536
        // Keep up to 512 bytes of tail from previous block for cross-boundary matches
        final int TAIL_MAX = 512
        assetsDir.eachFileRecurse { f ->
            if (!f.isFile()) return
            // Reject symlinks in staged assets
            if (java.nio.file.Files.isSymbolicLink(f.toPath())) {
                violations.add("[SYMLINK] staged asset is a symlink — rejected")
                return
            }
            // Forward-only streaming scan: read sequentially, carry tail overlap.
            boolean fileViolation = false
            byte[] buf = new byte[BUF_SIZE]
            byte[] tail = new byte[0]
            java.io.FileInputStream fis = null
            try {
                fis = new java.io.FileInputStream(f)
                while (!fileViolation) {
                    int n = fis.read(buf)
                    if (n == -1) break
                    if (n == 0) {
                        violations.add("[SCAN_ERROR] unable to scan staged asset")
                        fileViolation = true
                        break
                    }
                    // Build combined block: previous tail + new bytes
                    byte[] combined = new byte[tail.length + n]
                    System.arraycopy(tail, 0, combined, 0, tail.length)
                    System.arraycopy(buf, 0, combined, tail.length, n)
                    // Decode as ISO-8859-1 to preserve all byte values as chars (ASCII-safe)
                    String text = new String(combined, java.nio.charset.StandardCharsets.ISO_8859_1)
                    // 1. Forbidden private API routes (substring match)
                    for (def route in PUBLIC_FORBIDDEN_ROUTES) {
                        if (text.contains(route)) {
                            violations.add("[FORBIDDEN_ROUTE] asset contains private API route")
                            fileViolation = true
                            break
                        }
                    }
                    // 2. Forbidden credential/infrastructure patterns (regex)
                    if (!fileViolation) {
                        for (def pattern in PUBLIC_FORBIDDEN_PATTERNS) {
                            if (pattern.matcher(text).find()) {
                                violations.add("[FORBIDDEN_PATTERN] asset matches credential or private-infrastructure pattern")
                                fileViolation = true
                                break
                            }
                        }
                    }
                    // Update tail: keep last up to TAIL_MAX bytes of combined block
                    int totalLen = combined.length
                    if (totalLen > TAIL_MAX) {
                        int keep = totalLen - TAIL_MAX
                        tail = new byte[TAIL_MAX]
                        System.arraycopy(combined, keep, tail, 0, TAIL_MAX)
                    } else {
                        tail = combined
                    }
                }
            } catch (Exception e) {
                violations.add("[SCAN_ERROR] unable to scan staged asset")
            } finally {
                if (fis != null) {
                    try { fis.close() } catch (Exception ignore) {}
                }
            }
        }
        if (!violations.isEmpty()) {
            // Deduplicate and report cause classes only — never the matched bytes or filenames
            def uniqueViolations = violations.unique()
            throw new GradleException("PUBLIC profile asset violation — forbidden content detected in staged assets:\n  " + uniqueViolations.join("\n  ") + "\nBuild aborted. NO_DATA(public_asset_violation)")
        }
    }
}

tasks.register('copyPanels', Copy) {
    dependsOn 'copyPanelsInterface', 'copyPanelsAssets', 'copyPanelsBridges', 'copyPanelsLicenses'
    // The pinned source GGUF is owner-read-only. Gradle's Copy may preserve 0400
    // on the generated build asset, so a subsequent clean build must restore
    // write permission on that GENERATED copy only (never on the source).
    doFirst {
        if (project.hasProperty('offlineMiniModel')) {
            def target = file('src/main/assets/offline-mini.gguf')
            if (target.exists()) {
                if (java.nio.file.Files.isSymbolicLink(target.toPath())) {
                    throw new GradleException('Refusing to overwrite a symlinked model asset')
                }
                if (!target.setWritable(true, true)) {
                    throw new GradleException('Generated model asset is not writable')
                }
            }
        }
    }
    // Optional GGUF model (OWNER profile or explicit property).
    if (project.hasProperty('offlineMiniModel')) {
        from(project.file(project.property('offlineMiniModel'))) {
            rename { 'offline-mini.gguf' }
        }
    }
    into assetsDir
}

// PUBLIC profile: generatePublicProjection depends on copyPanels sub-tasks (so it runs
// AFTER prepareAssets + copy, and the generated app.html is preserved).
// copyPanels depends on generatePublicProjection (so the projection is present).
// verification runs after copyPanels (so all staged assets are checked).
if (!isOwnerProfile) {
    tasks.named('copyPanels') {
        dependsOn 'generatePublicProjection'
        finalizedBy 'verifyPublicAssets'
    }
}
// Canonical launcher bitmap: generated by icons_from_emblem.py from the ASCII emblem.
// Never keep a second binary in git. Android resources are produced under build/ only.
def launcherIcon = new File(appRoot, 'assets/icono-192.png')
tasks.register('copyLauncherEmblem', Copy) {
    doFirst {
        if (!launcherIcon.isFile() || java.nio.file.Files.isSymbolicLink(launcherIcon.toPath())
                || launcherIcon.length() > 512 * 1024) {
            throw new GradleException('NO_DATA(canonical_launcher_emblem_missing_or_invalid)')
        }
    }
    from launcherIcon
    into file("$buildDir/generated/preceptor-launcher/drawable-nodpi")
    rename { 'preceptor_launcher.png' }
}
afterEvaluate {
    tasks.named('preBuild') { dependsOn 'copyPanels', 'copyLauncherEmblem' }
}

android {
    sourceSets {
        main {
            res.srcDir file("$buildDir/generated/preceptor-launcher")
        }
    }
    namespace "org.preceptoros.mvp"
    compileSdk 36
    defaultConfig {
        applicationId mvpAppId
        minSdk 26
        targetSdk 36
        testInstrumentationRunner "org.preceptoros.mvp.OwnerFrameProbe"
        versionCode mvpVersionCode
        versionName (mvpAppId == 'org.preceptoros.app' ?
          (mvpVersionCode >= 8 ? '0.3.1-mini-recovery' : '0.3.0-mvp') : '0.1.0-mvp')
        // Machine-readable distribution profile: PUBLIC (default) or OWNER (explicit).
        // Both profiles share the same package ID; OWNER does not imply connected auth.
        def profileValue = appProfile ?: 'PUBLIC'
        buildConfigField 'String', 'APP_DISTRIBUTION_PROFILE', "\"${profileValue}\""
    }
    signingConfigs {
        release {
            // Signing material lives outside the repository; a build without it stays unsigned.
            if (useReleaseSigning) {
                storeFile new File(secretDir, "preceptoros.keystore")
                storePassword passFile.text.trim()
                keyAlias "preceptoros"
                keyPassword passFile.text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (useReleaseSigning) { signingConfig signingConfigs.release }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
