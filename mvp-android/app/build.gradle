plugins { id 'com.android.application' }

// The panels are the app's own interface/ folder, copied at build time: nothing is duplicated in git.
def secretDir = new File(System.getProperty("user.home"), ".config/preceptoros/android")
def passFile = new File(secretDir, "pass")
// v7 is installed on owner devices. Never produce an accidental downgrade by default.
def mvpVersionCode = (project.hasProperty('mvpVersionCode') ? project.property('mvpVersionCode') : '8') as Integer
// All normal Android builds target the ONE canonical signed APP identity.
// The legacy org.preceptoros.mvp ID is allowed only for an explicit, owner-led
// migration/export build. Changing the package ID is NOT an in-place update,
// even when both APKs share the same signing certificate.
def mvpAppId = project.hasProperty('mvpAppId') ? project.property('mvpAppId') : 'org.preceptoros.app'
def legacyMigrationOnly = project.findProperty('legacyMigrationOnly')?.toString() == 'true'
if (!(mvpAppId in ['org.preceptoros.mvp', 'org.preceptoros.app'])) {
    throw new GradleException('Unexpected Android package id')
}
if (mvpAppId == 'org.preceptoros.mvp' && !legacyMigrationOnly) {
    throw new GradleException('Legacy Android package needs explicit -PlegacyMigrationOnly=true for data export; never a second normal APP')
}
if (legacyMigrationOnly && mvpAppId != 'org.preceptoros.mvp') {
    throw new GradleException('Legacy migration flag may only be used with the legacy package ID')
}
if (mvpVersionCode < 1) {
    throw new GradleException('Android versionCode must be positive')
}
if (mvpAppId == 'org.preceptoros.app' && mvpVersionCode < 8) {
    throw new GradleException('Canonical Android upgrade requires versionCode >= 8 after owner release v7')
}

tasks.register('copyPanels', Copy) {
    // The pinned source GGUF is owner-read-only. Gradle's Copy may preserve 0400
    // on the generated build asset, so a subsequent clean build must restore
    // write permission on that GENERATED copy only (never on the source).
    doFirst {
        if (project.hasProperty('offlineMiniModel')) {
            def target = file('src/main/assets/offline-mini.gguf')
            if (target.exists()) {
                if (java.nio.file.Files.isSymbolicLink(target.toPath())) {
                    throw new GradleException('Refusing to overwrite a symlinked model asset')
                }
                if (!target.setWritable(true, true)) {
                    throw new GradleException('Generated model asset is not writable')
                }
            }
        }
    }
    from(rootProject.file('../interface')) {
        exclude 'legacy/**'
    }
    // Android-only capability: do not change or cache the browser/PWA shell.
    from(rootProject.file('android_review_bridge.js'))
    from(rootProject.file('offline_mini.js'))
    from(rootProject.file('android_join_bridge.js'))
    from(rootProject.file('android_heartbeat_bridge.js'))
    from(rootProject.file('legal')) { into 'licenses' }
    if (project.hasProperty('offlineMiniModel')) {
        from(project.file(project.property('offlineMiniModel'))) {
            rename { 'offline-mini.gguf' }
        }
    }
    into file('src/main/assets')
}
afterEvaluate { tasks.named('preBuild') { dependsOn 'copyPanels' } }

android {
    namespace "org.preceptoros.mvp"
    compileSdk 36
    defaultConfig {
        applicationId mvpAppId
        minSdk 26
        targetSdk 36
        versionCode mvpVersionCode
        versionName (mvpAppId == 'org.preceptoros.app' ?
          (mvpVersionCode >= 8 ? '0.3.1-mini-recovery' : '0.3.0-mvp') : '0.1.0-mvp')
    }
    signingConfigs {
        release {
            // Signing material lives outside the repository; a build without it stays unsigned.
            if (passFile.exists()) {
                storeFile new File(secretDir, "preceptoros.keystore")
                storePassword passFile.text.trim()
                keyAlias "preceptoros"
                keyPassword passFile.text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (passFile.exists()) { signingConfig signingConfigs.release }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
